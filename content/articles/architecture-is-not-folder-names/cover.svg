<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
	<title id="title">Architecture Is More Than Folder Names</title>
	<desc id="description">Folder labels are contrasted with an enforced dependency diagram where application code depends on abstractions and the domain stays independent of database technology.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#15243a" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#fbbf24" />
			<stop offset="100%" stop-color="#f97316" />
		</linearGradient>
		<radialGradient id="glow">
			<stop offset="0%" stop-color="#0e7490" stop-opacity="0.28" />
			<stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
		</radialGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity="0.45" />
		</filter>
	</defs>
	<rect width="1200" height="630" fill="url(#background)" />
	<circle cx="960" cy="310" r="390" fill="url(#glow)" />
	<path d="M0 540 C220 455 380 640 620 548 S1010 440 1200 520 V630 H0Z" fill="#091523" opacity="0.75" />

	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="76" y="100" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="3">SOFTWARE DESIGN · ARCHITECTURE</text>
		<text x="72" y="198" fill="#f8fafc" font-size="56" font-weight="800" letter-spacing="-2">Architecture</text>
		<text x="72" y="270" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-2">isn't a</text>
		<text x="72" y="342" fill="url(#accent)" font-size="54" font-weight="800" letter-spacing="-2">folder name.</text>
		<text x="77" y="404" fill="#cbd5e1" font-size="19" font-weight="500">Responsibilities and dependencies do the work.</text>
		<g transform="translate(78 468)">
			<rect width="350" height="58" rx="29" fill="#172b40" stroke="#35516b" />
			<circle cx="30" cy="29" r="8" fill="#34d399" />
			<text x="52" y="36" fill="#e2e8f0" font-size="13" font-weight="700" letter-spacing="0.8">NAMES DESCRIBE · CODE ENFORCES</text>
		</g>
	</g>

	<g filter="url(#shadow)">
		<rect x="520" y="92" width="620" height="452" rx="30" fill="#0b1728" stroke="#294057" stroke-width="2" />
		<text x="830" y="137" text-anchor="middle" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2.1">FOLDER LABELS ≠ DEPENDENCY RULES</text>
	</g>

	<g font-family="Inter, system-ui, sans-serif">
		<text x="650" y="184" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="2">THE NAMES</text>
		<path d="M576 226h18l9 10h94v45H576z" fill="#302618" stroke="#a16207" stroke-width="2" stroke-linejoin="round" />
		<text x="638" y="258" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12">domain/</text>
		<path d="M576 292h18l9 10h94v45H576z" fill="#302618" stroke="#a16207" stroke-width="2" stroke-linejoin="round" />
		<text x="638" y="324" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12">application/</text>
		<path d="M576 358h18l9 10h94v45H576z" fill="#302618" stroke="#a16207" stroke-width="2" stroke-linejoin="round" />
		<text x="638" y="390" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="12">infrastructure/</text>
		<text x="650" y="444" text-anchor="middle" fill="#94a3b8" font-size="11">A helpful start, not a guarantee</text>

		<path d="M764 300h34" stroke="#475569" stroke-width="2" stroke-dasharray="4 6" />
		<path d="M789 292l9 8-9 8" fill="none" stroke="#64748b" stroke-width="2" />

		<text x="956" y="184" text-anchor="middle" fill="#67e8f9" font-size="11" font-weight="800" letter-spacing="2">THE REAL BOUNDARIES</text>
		<g>
			<rect x="810" y="210" width="78" height="48" rx="12" fill="#172b40" stroke="#35516b" />
			<text x="849" y="240" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">WEB</text>
			<path d="M890 234h22" stroke="#67e8f9" stroke-width="2" />
			<path d="M906 228l7 6-7 6" fill="none" stroke="#67e8f9" stroke-width="2" />
			<rect x="916" y="210" width="78" height="48" rx="12" fill="#172b40" stroke="#35516b" />
			<text x="955" y="240" text-anchor="middle" fill="#e2e8f0" font-size="10" font-weight="700">USE CASE</text>
			<path d="M996 234h22" stroke="#67e8f9" stroke-width="2" />
			<path d="M1012 228l7 6-7 6" fill="none" stroke="#67e8f9" stroke-width="2" />
			<rect x="1022" y="210" width="78" height="48" rx="12" fill="#123447" stroke="#0e7490" />
			<text x="1061" y="240" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="700">DOMAIN</text>
		</g>
		<g>
			<rect x="832" y="322" width="108" height="48" rx="12" fill="#12372f" stroke="#059669" />
			<text x="886" y="351" text-anchor="middle" fill="#d1fae5" font-size="10" font-weight="700">ADAPTER</text>
			<path d="M942 346h28" stroke="#34d399" stroke-width="2" />
			<path d="M964 340l7 6-7 6" fill="none" stroke="#34d399" stroke-width="2" />
			<rect x="974" y="322" width="126" height="48" rx="12" fill="#123447" stroke="#0e7490" />
			<text x="1037" y="351" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="700">PORT</text>
			<path d="M1061 260v48" stroke="#fb7185" stroke-width="2" stroke-dasharray="5 5" />
			<circle cx="1061" cy="298" r="12" fill="#4c1d2c" stroke="#fb7185" stroke-width="2" />
			<path d="M1056 293l10 10m0-10l-10 10" stroke="#fecdd3" stroke-width="2" stroke-linecap="round" />
			<text x="1061" y="398" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="700">NO DB IMPORT IN DOMAIN</text>
		</g>
		<text x="956" y="444" text-anchor="middle" fill="#94a3b8" font-size="11">Modules · tests · build rules</text>
	</g>
</svg>