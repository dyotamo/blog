<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An application communicates with the kernel through system libraries and system calls">
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#111b32" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#4f46e5" />
			<stop offset="100%" stop-color="#0891b2" />
		</linearGradient>
		<radialGradient id="glow" cx="76%" cy="44%" r="58%">
			<stop offset="0%" stop-color="#0891b2" stop-opacity="0.2" />
			<stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#background)" />
	<rect width="1200" height="630" fill="url(#glow)" />
	<path d="M0 540H1200" stroke="#334155" stroke-opacity="0.45" />
	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="80" y="118" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="3.2">LINUX · USERSPACE · ABI</text>
		<text x="80" y="220" fill="#f8fafc" font-size="56" font-weight="800">So, what exactly</text>
		<text x="80" y="290" fill="#22d3ee" font-size="56" font-weight="800">is libc?</text>
		<text x="82" y="350" fill="#cbd5e1" font-size="19" font-weight="500">How applications reach the kernel.</text>
		<text x="82" y="399" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.4">API · ABI · LOADER · GO RUNTIME</text>
	</g>
	<g transform="translate(650 118)" font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="220" y="0" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">EXECUTION PATH</text>
		<rect x="10" y="30" width="420" height="72" rx="14" fill="#101b33" stroke="#818cf8" stroke-width="2" />
		<text x="220" y="73" text-anchor="middle" fill="#e0e7ff" font-size="19" font-weight="700">Application</text>
		<path d="M220 102V137" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
		<circle cx="220" cy="138" r="4" fill="#818cf8" />
		<rect x="10" y="153" width="420" height="72" rx="14" fill="#0f1d30" stroke="#22d3ee" stroke-width="2" />
		<text x="220" y="196" text-anchor="middle" fill="#cffafe" font-size="19" font-weight="700">Runtime and libc</text>
		<path d="M220 225V260" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
		<circle cx="220" cy="261" r="4" fill="#22d3ee" />
		<rect x="10" y="276" width="420" height="72" rx="14" fill="#0b2633" stroke="#0891b2" stroke-width="2" />
		<text x="220" y="319" text-anchor="middle" fill="#cffafe" font-size="19" font-weight="700">System call</text>
		<path d="M220 348V383" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
		<circle cx="220" cy="384" r="4" fill="#0891b2" />
		<rect x="10" y="399" width="420" height="72" rx="14" fill="url(#accent)" />
		<text x="220" y="442" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="700">Linux kernel</text>
	</g>
	<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#64748b" font-size="11" font-weight="600">
		<text x="80" y="582">LIBC</text>
		<circle cx="132" cy="578" r="2" fill="#22d3ee" />
		<text x="148" y="582">SYSTEM CALLS</text>
		<circle cx="258" cy="578" r="2" fill="#818cf8" />
		<text x="274" y="582">ABI</text>
		<text x="1120" y="582" text-anchor="end">LINUX USERSPACE</text>
	</g>
</svg>
