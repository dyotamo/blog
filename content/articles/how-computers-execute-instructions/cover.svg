<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="From Rust source code through machine instructions and logic gates to transistors">
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#111b32" />
		</linearGradient>
		<linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#22d3ee" />
			<stop offset="100%" stop-color="#818cf8" />
		</linearGradient>
		<radialGradient id="glow" cx="82%" cy="48%" r="55%">
			<stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
			<stop offset="100%" stop-color="#2563eb" stop-opacity="0" />
		</radialGradient>
	</defs>
	<rect width="1200" height="630" fill="url(#background)" />
	<rect width="1200" height="630" fill="url(#glow)" />
	<path d="M0 540H1200" stroke="#334155" stroke-opacity="0.55" />
	<g fill="#94a3b8" opacity="0.35">
		<circle cx="40" cy="40" r="2" /><circle cx="80" cy="40" r="2" /><circle cx="120" cy="40" r="2" />
		<circle cx="40" cy="80" r="2" /><circle cx="80" cy="80" r="2" /><circle cx="120" cy="80" r="2" />
		<circle cx="1080" cy="40" r="2" /><circle cx="1120" cy="40" r="2" /><circle cx="1160" cy="40" r="2" />
		<circle cx="1080" cy="80" r="2" /><circle cx="1120" cy="80" r="2" /><circle cx="1160" cy="80" r="2" />
	</g>
	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="80" y="112" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="3.4">FROM SOURCE CODE TO ELECTRONS</text>
		<text x="80" y="207" fill="#f8fafc" font-size="48" font-weight="800">How computers</text>
		<text x="80" y="269" fill="#f8fafc" font-size="48" font-weight="800">execute</text>
		<text x="80" y="331" fill="#22d3ee" font-size="48" font-weight="800">instructions</text>
		<text x="82" y="386" fill="#cbd5e1" font-size="19" font-weight="500">A simple addition, all the way down.</text>
		<text x="82" y="440" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.7">COMPILERS · CPU · LOGIC · TRANSISTORS</text>
	</g>
	<g transform="translate(610 145)" font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="270" y="0" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="2.2">ONE OPERATION, MANY LAYERS</text>
		<g transform="translate(0 30)">
			<rect width="150" height="150" rx="14" fill="#0f1d30" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2" />
			<rect x="14" y="14" width="122" height="24" rx="12" fill="#164e63" />
			<text x="75" y="31" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="700" letter-spacing="1.3">SOURCE CODE</text>
			<text x="25" y="78" fill="#cbd5e1" font-size="16" font-family="Source Code Pro, monospace">let c =</text>
			<text x="25" y="104" fill="#67e8f9" font-size="19" font-weight="700" font-family="Source Code Pro, monospace">a + b;</text>
			<text x="75" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">human-readable intent</text>
		</g>
		<path d="M158 105h18m-7-7 7 7-7 7" fill="none" stroke="#67e8f9" stroke-width="2" />
		<g transform="translate(184 30)">
			<rect width="150" height="150" rx="14" fill="#111b33" stroke="#818cf8" stroke-opacity="0.8" stroke-width="2" />
			<rect x="14" y="14" width="122" height="24" rx="12" fill="#312e81" />
			<text x="75" y="31" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700" letter-spacing="1.1">MACHINE CODE</text>
			<text x="20" y="79" fill="#c7d2fe" font-size="13" font-family="Source Code Pro, monospace">10100110</text>
			<text x="20" y="102" fill="#a5b4fc" font-size="13" font-family="Source Code Pro, monospace">00001100</text>
			<text x="75" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">bits describe operations</text>
		</g>
		<path d="M342 105h18m-7-7 7 7-7 7" fill="none" stroke="#a5b4fc" stroke-width="2" />
		<g transform="translate(368 30)">
			<rect width="150" height="150" rx="14" fill="#0e2030" stroke="#38bdf8" stroke-opacity="0.8" stroke-width="2" />
			<rect x="14" y="14" width="122" height="24" rx="12" fill="#0c4a6e" />
			<text x="75" y="31" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="700" letter-spacing="1.3">SILICON</text>
			<path d="M42 70h18m30 0h18M60 60v20m30-20v20M60 70h30M75 44v16m0 20v16" fill="none" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" />
			<circle cx="75" cy="70" r="7" fill="#22d3ee" />
			<circle cx="75" cy="44" r="4" fill="#818cf8" />
			<circle cx="75" cy="96" r="4" fill="#818cf8" />
			<text x="75" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">transistors switch signals</text>
		</g>
		<g stroke="#475569" stroke-width="2" stroke-dasharray="4 6" opacity="0.8">
			<path d="M75 182v42m184-42v42m184-42v42" />
		</g>
		<g fill="#67e8f9"><circle cx="75" cy="225" r="4" /><circle cx="259" cy="225" r="4" /><circle cx="443" cy="225" r="4" /></g>
		<rect x="0" y="240" width="518" height="64" rx="13" fill="#172554" stroke="#3b82f6" stroke-opacity="0.65" />
		<text x="259" y="266" text-anchor="middle" fill="#e0e7ff" font-size="14" font-weight="800" letter-spacing="1.2">-90 + 12 = -78</text>
		<text x="259" y="287" text-anchor="middle" fill="#a5b4fc" font-size="11">a computation becomes electrical behavior</text>
	</g>
	<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#64748b" font-size="11" font-weight="600">
		<text x="80" y="582">ABSTRACTIONS ABOVE</text>
		<circle cx="216" cy="578" r="2" fill="#22d3ee" />
		<text x="232" y="582">ELECTRICAL SWITCHING BELOW</text>
		<text x="1120" y="582" text-anchor="end">CODE → SILICON</text>
	</g>
</svg>