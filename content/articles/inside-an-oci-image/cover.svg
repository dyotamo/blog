<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="An OCI image manifest references configuration metadata and ordered filesystem layers">
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#111b32" />
		</linearGradient>
		<linearGradient id="manifest" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#4f46e5" />
			<stop offset="100%" stop-color="#2563eb" />
		</linearGradient>
		<linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#0891b2" />
			<stop offset="100%" stop-color="#0e7490" />
		</linearGradient>
		<radialGradient id="glow" cx="78%" cy="42%" r="58%">
			<stop offset="0%" stop-color="#0891b2" stop-opacity="0.2" />
			<stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#background)" />
	<rect width="1200" height="630" fill="url(#glow)" />
	<path d="M0 540H1200" stroke="#334155" stroke-opacity="0.45" />
	<g fill="#94a3b8" opacity="0.38">
		<circle cx="40" cy="40" r="2" /><circle cx="80" cy="40" r="2" /><circle cx="120" cy="40" r="2" />
		<circle cx="40" cy="80" r="2" /><circle cx="80" cy="80" r="2" /><circle cx="120" cy="80" r="2" />
		<circle cx="1080" cy="40" r="2" /><circle cx="1120" cy="40" r="2" /><circle cx="1160" cy="40" r="2" />
		<circle cx="1080" cy="80" r="2" /><circle cx="1120" cy="80" r="2" /><circle cx="1160" cy="80" r="2" />
	</g>

	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="80" y="118" fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="3.2">CONTAINER IMAGE FORMAT</text>
		<text x="80" y="222" fill="#f8fafc" font-size="58" font-weight="800">Inside an</text>
		<text x="80" y="292" fill="#22d3ee" font-size="58" font-weight="800">OCI image?</text>
		<text x="82" y="352" fill="#cbd5e1" font-size="19" font-weight="500">Manifests, metadata, filesystem layers.</text>
		<text x="82" y="399" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.4">CONTENT-ADDRESSED · ORDERED · REUSABLE</text>
	</g>

	<g transform="translate(660 104)" font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="220" y="0" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">OCI IMAGE · ONE PLATFORM</text>

		<rect x="0" y="28" width="440" height="92" rx="14" fill="#101b33" stroke="#818cf8" stroke-opacity="0.8" stroke-width="2" />
		<rect x="18" y="44" width="98" height="24" rx="12" fill="#312e81" />
		<text x="67" y="60" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="800" letter-spacing="1.2">MANIFEST</text>
		<text x="20" y="91" fill="#f8fafc" font-size="16" font-weight="700">Descriptors + digests</text>
		<text x="418" y="91" text-anchor="end" fill="#a5b4fc" font-size="12" font-family="ui-monospace, SFMono-Regular, monospace">sha256:…</text>

		<path d="M220 120V150" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
		<circle cx="220" cy="151" r="4" fill="#818cf8" />

		<rect x="0" y="166" width="440" height="92" rx="14" fill="#0f1d30" stroke="#22d3ee" stroke-opacity="0.75" stroke-width="2" />
		<rect x="18" y="182" width="142" height="24" rx="12" fill="#164e63" />
		<text x="89" y="198" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="800" letter-spacing="1.1">IMAGE CONFIG</text>
		<text x="20" y="229" fill="#f8fafc" font-size="15" font-weight="700">Platform + execution defaults</text>
		<text x="418" y="229" text-anchor="end" fill="#67e8f9" font-size="11" font-family="ui-monospace, SFMono-Regular, monospace">linux / amd64</text>

		<path d="M220 258V288" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" />
		<circle cx="220" cy="289" r="4" fill="#22d3ee" />

		<rect x="0" y="304" width="440" height="172" rx="14" fill="#0b1728" stroke="#0e7490" stroke-opacity="0.85" stroke-width="2" />
		<text x="20" y="332" fill="#67e8f9" font-size="11" font-weight="800" letter-spacing="1.6">FILESYSTEM LAYERS · APPLIED IN ORDER</text>
		<rect x="20" y="348" width="400" height="31" rx="7" fill="#10283a" stroke="#155e75" />
		<circle cx="37" cy="363" r="5" fill="#22d3ee" />
		<text x="53" y="368" fill="#e0f2fe" font-size="12" font-weight="700">Layer 3</text>
		<text x="400" y="368" text-anchor="end" fill="#94a3b8" font-size="11">application files</text>
		<rect x="20" y="388" width="400" height="31" rx="7" fill="#10283a" stroke="#155e75" />
		<circle cx="37" cy="403" r="5" fill="#38bdf8" />
		<text x="53" y="408" fill="#e0f2fe" font-size="12" font-weight="700">Layer 2</text>
		<text x="400" y="408" text-anchor="end" fill="#94a3b8" font-size="11">dependencies</text>
		<rect x="20" y="428" width="400" height="31" rx="7" fill="url(#layer)" />
		<circle cx="37" cy="443" r="5" fill="#cffafe" />
		<text x="53" y="448" fill="#ecfeff" font-size="12" font-weight="700">Layer 1</text>
		<text x="400" y="448" text-anchor="end" fill="#cffafe" font-size="11">base filesystem</text>
	</g>

	<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#64748b" font-size="11" font-weight="600">
		<text x="80" y="582">MANIFEST</text>
		<circle cx="166" cy="578" r="2" fill="#22d3ee" />
		<text x="182" y="582">CONFIGURATION</text>
		<circle cx="302" cy="578" r="2" fill="#818cf8" />
		<text x="318" y="582">LAYERS</text>
		<text x="1120" y="582" text-anchor="end">OCI IMAGE SPECIFICATION</text>
	</g>
</svg>
