	<g transform="translate(1022 270)">
		<circle cx="42" cy="40" r="43" fill="#12372f" stroke="#34d399" stroke-width="2" />
		<path d="M22 41l13 13 27-29" fill="none" stroke="#6ee7b7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
		<text x="42" y="105" text-anchor="middle" fill="#a7f3d0" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700">PEDIDO SERVIDO</text>
	</g>
	<text x="830" y="540" text-anchor="middle" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="12">As réplicas reconciliam-se quando a ligação é restabelecida</text>
