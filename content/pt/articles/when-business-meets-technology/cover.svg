		</g>
		<g transform="translate(820 325)">
			<rect width="108" height="82" rx="16" fill="#123447" stroke="#22d3ee" stroke-width="2" />
			<rect x="34" y="18" width="40" height="32" rx="5" fill="#164e63" stroke="#67e8f9" stroke-width="2" />
			<path d="M42 27h24M42 34h24M42 41h15" stroke="#a5f3fc" stroke-width="2" stroke-linecap="round" />
			<circle cx="48" cy="60" r="3" fill="#34d399" />
			<circle cx="58" cy="60" r="3" fill="#34d399" />
			<circle cx="68" cy="60" r="3" fill="#34d399" />
			<text x="54" y="106" fill="#bae6fd" font-size="12" font-weight="700">RÉPLICA B</text>
		</g>
		<g transform="translate(820 439)" opacity="0.56">
			<rect width="108" height="82" rx="16" fill="#1e293b" stroke="#64748b" stroke-width="2" />
			<rect x="34" y="18" width="40" height="32" rx="5" fill="#334155" stroke="#94a3b8" stroke-width="2" />
			<path d="M42 27h24M42 34h24M42 41h15" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
			<path d="M48 58l20 20M68 58L48 78" stroke="#fb7185" stroke-width="4" stroke-linecap="round" />
			<text x="54" y="106" fill="#cbd5e1" font-size="11" font-weight="700">NÓ INDISPONÍVEL</text>
		</g>
