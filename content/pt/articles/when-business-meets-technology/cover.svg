<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
	<title id="title">Quando o Negócio Encontra a Tecnologia: A História do Dynamo</title>
	<desc id="description">Um carrinho de compras continua disponível enquanto nós de uma base de dados distribuída mantêm réplicas dos dados.</desc>
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#13243a" />
		</linearGradient>
		<linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#fbbf24" />
			<stop offset="100%" stop-color="#f97316" />
		</linearGradient>
		<radialGradient id="glow">
			<stop offset="0%" stop-color="#0e7490" stop-opacity="0.32" />
			<stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
		</radialGradient>
		<filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
			<feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.45" />
		</filter>
	</defs>
	<rect width="1200" height="630" fill="url(#background)" />
	<circle cx="960" cy="310" r="370" fill="url(#glow)" />
	<path d="M0 520 C240 440 385 650 650 554 S1020 430 1200 500 V630 H0Z" fill="#0b1728" opacity="0.65" />

	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="76" y="98" fill="#67e8f9" font-size="17" font-weight="700" letter-spacing="3">NEGÓCIO E SISTEMAS DISTRIBUÍDOS</text>
		<text x="72" y="188" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-2">O carrinho</text>
		<text x="72" y="266" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-2">não pode</text>
		<text x="72" y="344" fill="url(#accent)" font-size="68" font-weight="800" letter-spacing="-2">parar.</text>
		<text x="77" y="405" fill="#cbd5e1" font-size="20" font-weight="500">A necessidade de negócio por trás do Dynamo</text>
		<g transform="translate(78 458)">
			<rect width="340" height="58" rx="29" fill="#172b40" stroke="#35516b" />
			<circle cx="30" cy="29" r="8" fill="#34d399" />
			<text x="52" y="36" fill="#e2e8f0" font-size="14" font-weight="700" letter-spacing="0.7">CONTINUAR MESMO PERANTE FALHAS</text>
		</g>
	</g>

	<g filter="url(#shadow)">
		<rect x="522" y="104" width="620" height="462" rx="30" fill="#0b1728" stroke="#294057" stroke-width="2" />
		<text x="562" y="151" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">UM CARRINHO DE COMPRAS ALTAMENTE DISPONÍVEL</text>
	</g>

	<g fill="none" stroke-linecap="round" stroke-width="4">
		<path d="M668 306 C740 306 758 248 820 248" stroke="#38bdf8" />
		<path d="M668 306 C740 306 758 366 820 366" stroke="#38bdf8" />
		<path d="M668 306 C740 306 755 480 820 480" stroke="#475569" stroke-dasharray="9 10" />
		<path d="M928 248 C987 248 987 310 1022 310" stroke="#38bdf8" />
