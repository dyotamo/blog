<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Containers são processos Linux com contextos isolados que partilham o kernel do host">
	<defs>
		<linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#07111f" />
			<stop offset="100%" stop-color="#111b32" />
		</linearGradient>
		<linearGradient id="kernel" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#4f46e5" />
			<stop offset="100%" stop-color="#2563eb" />
		</linearGradient>
		<radialGradient id="glow" cx="78%" cy="48%" r="54%">
			<stop offset="0%" stop-color="#0891b2" stop-opacity="0.22" />
			<stop offset="100%" stop-color="#0891b2" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#background)" />
	<rect width="1200" height="630" fill="url(#glow)" />
	<path d="M0 540H1200" stroke="#334155" stroke-opacity="0.45" />
	<g fill="#94a3b8" opacity="0.38">
		<circle cx="40" cy="40" r="2" /><circle cx="80" cy="40" r="2" /><circle cx="120" cy="40" r="2" />
		<circle cx="40" cy="80" r="2" /><circle cx="80" cy="80" r="2" /><circle cx="120" cy="80" r="2" />
		<circle cx="1080" cy="40" r="2" /><circle cx="1120" cy="40" r="2" /><circle cx="1160" cy="40" r="2" />
		<circle cx="1080" cy="80" r="2" /><circle cx="1120" cy="80" r="2" /><circle cx="1160" cy="80" r="2" />
	</g>

	<g font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="80" y="112" fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="4">CONTAINERS LINUX POR DENTRO</text>
		<text x="80" y="202" fill="#f8fafc" font-size="54" font-weight="800">Um container é</text>
		<text x="80" y="267" fill="#f8fafc" font-size="54" font-weight="800">um processo</text>
		<text x="80" y="332" fill="#22d3ee" font-size="54" font-weight="800">com contexto.</text>
		<text x="82" y="383" fill="#cbd5e1" font-size="20" font-weight="500">Visões isoladas. Kernel Linux partilhado.</text>
		<text x="82" y="440" fill="#94a3b8" font-size="13" font-weight="700" letter-spacing="1.6">NAMESPACES · CGROUPS · SISTEMA DE FICHEIROS</text>
	</g>

	<g transform="translate(610 128)" font-family="Inter, system-ui, -apple-system, sans-serif">
		<text x="250" y="0" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">CONTEXTOS DE PROCESSO ISOLADOS</text>
		<g transform="translate(0 28)">
			<rect width="156" height="176" rx="14" fill="#0f1d30" stroke="#22d3ee" stroke-opacity="0.7" stroke-width="2" />
			<rect x="14" y="16" width="128" height="26" rx="13" fill="#164e63" />
			<text x="78" y="34" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="700" letter-spacing="1.3">NAMESPACE A</text>
			<rect x="20" y="62" width="116" height="52" rx="9" fill="#123044" stroke="#0e7490" />
			<circle cx="40" cy="88" r="7" fill="#22d3ee" />
			<text x="55" y="84" fill="#f8fafc" font-size="13" font-weight="700">processo</text>
			<text x="55" y="101" fill="#94a3b8" font-size="10">PID 1 interno</text>
			<text x="78" y="144" text-anchor="middle" fill="#67e8f9" font-size="10" font-weight="600">visão + limites</text>
		</g>
		<g transform="translate(172 28)">
			<rect width="156" height="176" rx="14" fill="#101b33" stroke="#818cf8" stroke-opacity="0.8" stroke-width="2" />
			<rect x="14" y="16" width="128" height="26" rx="13" fill="#312e81" />
			<text x="78" y="34" text-anchor="middle" fill="#c7d2fe" font-size="10" font-weight="700" letter-spacing="1.3">NAMESPACE B</text>
			<rect x="20" y="62" width="116" height="52" rx="9" fill="#1e2545" stroke="#4f46e5" />
			<circle cx="40" cy="88" r="7" fill="#818cf8" />
			<text x="55" y="84" fill="#f8fafc" font-size="13" font-weight="700">processo</text>
			<text x="55" y="101" fill="#94a3b8" font-size="10">PID 1 interno</text>
			<text x="78" y="144" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">visão + limites</text>
		</g>
		<g transform="translate(344 28)">
			<rect width="156" height="176" rx="14" fill="#0f1d30" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="2" />
			<rect x="14" y="16" width="128" height="26" rx="13" fill="#0c4a6e" />
			<text x="78" y="34" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="700" letter-spacing="1.3">NAMESPACE C</text>
			<rect x="20" y="62" width="116" height="52" rx="9" fill="#123044" stroke="#0369a1" />
			<circle cx="40" cy="88" r="7" fill="#38bdf8" />
			<text x="55" y="84" fill="#f8fafc" font-size="13" font-weight="700">processo</text>
			<text x="55" y="101" fill="#94a3b8" font-size="10">PID 1 interno</text>
			<text x="78" y="144" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">visão + limites</text>
		</g>
		<g stroke="#64748b" stroke-width="2" stroke-dasharray="5 6" opacity="0.8">
			<path d="M78 204V238" /><path d="M250 204V238" /><path d="M422 204V238" />
		</g>
		<g fill="#94a3b8"><circle cx="78" cy="239" r="4" /><circle cx="250" cy="239" r="4" /><circle cx="422" cy="239" r="4" /></g>
		<rect x="0" y="254" width="500" height="76" rx="14" fill="url(#kernel)" />
		<g transform="translate(22 274)" fill="none" stroke="#e0e7ff" stroke-width="2">
			<path d="M10 0 27 6v13c0 12-8 19-17 24C1 38-7 31-7 19V6z" />
			<path d="m2 19 6 6 12-13" />
		</g>
		<text x="66" y="286" fill="#eef2ff" font-size="15" font-weight="800" letter-spacing="1.5">UM ÚNICO KERNEL LINUX</text>
		<text x="66" y="308" fill="#c7d2fe" font-size="11">agenda todos os processos · serve todas as syscalls</text>
	</g>

	<g font-family="Inter, system-ui, -apple-system, sans-serif" fill="#64748b" font-size="11" font-weight="600">
		<text x="80" y="582">MESMO KERNEL</text>
		<circle cx="174" cy="578" r="2" fill="#22d3ee" />
		<text x="190" y="582">CONTEXTOS DIFERENTES</text>
		<text x="1120" y="582" text-anchor="end">PROCESSO ≠ VM</text>
	</g>
</svg>
