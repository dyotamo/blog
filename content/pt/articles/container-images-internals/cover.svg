<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Imagens de containers, camada a camada</title>
  <desc id="description">Um manifesto OCI aponta para camadas imutáveis do sistema de ficheiros, combinadas numa vista única com uma camada gravável do container.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b32"/>
      <stop offset="1" stop-color="#172944"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#020617" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <circle cx="1060" cy="70" r="220" fill="#38bdf8" opacity=".06"/>
  <circle cx="980" cy="580" r="270" fill="#8b5cf6" opacity=".08"/>
  <path d="M0 510C220 450 350 620 610 550s390-130 590-45v125H0Z" fill="#0b1324" opacity=".36"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="82" y="146" fill="#5eead4" font-size="20" font-weight="700" letter-spacing="4">SISTEMA DE FICHEIROS DO CONTAINER</text>
    <text x="78" y="236" fill="#f8fafc" font-size="56" font-weight="750">Imagens de containers,</text>
    <text x="78" y="304" fill="#f8fafc" font-size="56" font-weight="750">camada a camada.</text>
    <text x="82" y="360" fill="#b8c7dc" font-size="23" font-weight="400">Metadados OCI · camadas imutáveis · cópia na escrita</text>
    <g transform="translate(82 430)">
      <rect width="103" height="36" rx="18" fill="#173c49" stroke="#2dd4bf" stroke-opacity=".45"/>
      <text x="51.5" y="24" fill="#99f6e4" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">OCI</text>
      <rect x="119" width="132" height="36" rx="18" fill="#25345b" stroke="#818cf8" stroke-opacity=".5"/>
      <text x="185" y="24" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">OVERLAYFS</text>
    </g>
  </g>
  <g filter="url(#shadow)" transform="translate(682 122)">
    <rect x="49" y="0" width="298" height="72" rx="16" fill="#213650" stroke="#6b829e" stroke-opacity=".65"/>
    <path d="M75 24h28m-28 12h54m-54 12h40" stroke="#91a5be" stroke-width="5" stroke-linecap="round"/>
    <text x="157" y="43" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="650">Manifesto OCI</text>
    <path d="M198 77v28m0 0H72v26m126-26h126v26" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="5 8" opacity=".8"/>
    <g transform="translate(0 140)">
      <rect x="0" y="0" width="170" height="66" rx="14" fill="#20334e" stroke="#5b7698"/>
      <path d="M23 22h29m-29 12h48" stroke="#89a4c3" stroke-width="4" stroke-linecap="round"/>
      <text x="89" y="42" fill="#c8d5e6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">configuração</text>
      <g transform="translate(215)">
        <rect x="0" y="0" width="245" height="66" rx="14" fill="#20334e" stroke="#5b7698"/>
        <circle cx="28" cy="24" r="5" fill="#5eead4"/>
        <circle cx="44" cy="24" r="5" fill="#a78bfa"/>
        <circle cx="60" cy="24" r="5" fill="#38bdf8"/>
        <text x="151" y="42" fill="#c8d5e6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" text-anchor="middle">blobs das camadas</text>
      </g>
    </g>
    <path d="M337 214v40" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(75 285)">
      <path d="M0 28 132 0l132 28-132 29Z" fill="url(#violet)" opacity=".95"/>
      <path d="M0 28v43l132 31V57Z" fill="#5146b8"/>
      <path d="M264 28v43l-132 31V57Z" fill="#39358f"/>
      <path d="M0 91l132 31 132-31v33l-132 31L0 124Z" fill="#227e9f"/>
      <path d="m0 124 132 31 132-31v32l-132 31L0 156Z" fill="#175e7d"/>
      <path d="m0 156 132 31 132-31v31l-132 32L0 187Z" fill="#153f61"/>
      <path d="M0 91v33m264-33v33M0 124v32m264-32v32M0 156v31m264-31v31" fill="none" stroke="#85e5f5" stroke-opacity=".38" stroke-width="2"/>
      <text x="132" y="27" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CAMADA GRAVÁVEL</text>
      <text x="132" y="85" fill="#e0e7ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">APLICAÇÃO</text>
      <text x="132" y="119" fill="#d6f5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">DEPENDÊNCIAS</text>
      <text x="132" y="151" fill="#d6f5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">IMAGEM BASE</text>
      <rect x="310" y="69" width="151" height="92" rx="16" fill="#14253b" stroke="#54d5cc" stroke-width="2"/>
      <path d="M334 97h39m-39 16h68m-68 16h54" stroke="#79d9d5" stroke-width="4" stroke-linecap="round"/>
      <text x="385" y="151" fill="#d6f5ff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">VISTA COMBINADA</text>
      <path d="M264 115h33" stroke="#5eead4" stroke-width="3" marker-end="url(#arrow)"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#5eead4"/>
    </marker>
  </defs>
</svg>
