<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="HTTP QUERY method — OpenGraph card">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#0a0a14" />
			<stop offset="100%" stop-color="#150f2e" />
		</linearGradient>
		<linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#0f0a1f" />
			<stop offset="100%" stop-color="#1a1133" />
		</linearGradient>
		<linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0%" stop-color="#a855f7" />
			<stop offset="100%" stop-color="#06b6d4" />
		</linearGradient>
		<linearGradient id="methodGrad" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#a855f7" />
			<stop offset="100%" stop-color="#7c3aed" />
		</linearGradient>
		<radialGradient id="glow" cx="50%" cy="0%" r="60%">
			<stop offset="0%" stop-color="#a855f7" stop-opacity="0.30" />
			<stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
		</radialGradient>
	</defs>

	<rect width="1200" height="630" fill="url(#bg)" />
	<rect width="1200" height="630" fill="url(#glow)" />

	<g font-family="'Inter', system-ui, -apple-system, sans-serif" text-anchor="middle">
		<text x="600" y="96" font-size="18" font-weight="700" letter-spacing="0.40em" fill="#c4b5fd">RFC 10008  ·  JUNE 2026</text>

		<g transform="translate(600 210)">
			<text font-size="160" font-weight="900" fill="#f5f3ff">HTTP <tspan fill="url(#methodGrad)" stroke="#a855f7" stroke-width="2">QUERY</tspan></text>
		</g>

		<text x="600" y="278" font-size="26" font-weight="500" fill="#e9d5ff">
			The safe, idempotent GET — finally with a body.
		</text>
	</g>

	<g transform="translate(120 340)">
		<rect x="0" y="0" width="960" height="170" rx="16" fill="url(#termBg)" stroke="#3b2667" stroke-width="2" />
		<g transform="translate(30 30)">
			<rect x="0" y="0" width="155" height="48" rx="10" fill="#7c3aed" />
			<text x="77" y="32" font-family="'JetBrains Mono', 'Menlo', monospace" font-size="22" font-weight="800" fill="#fff7ed" text-anchor="middle">QUERY</text>

			<text x="180" y="22" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700" fill="#f5f3ff">/feed</text>
			<text x="180" y="42" font-family="'JetBrains Mono', monospace" font-size="14" fill="#94a3b8">HTTP/1.1 · safe · cacheable</text>

			<text x="0" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.20em" fill="#a78bfa">REQUEST BODY</text>
			<rect x="0" y="100" width="900" height="36" rx="6" fill="#1a1133" stroke="url(#purple)" />
			<text x="14" y="124" font-family="'JetBrains Mono', monospace" font-size="14" fill="#c4b5fd">SELECT id, title FROM feed WHERE published_at &gt; NOW() - INTERVAL '7 days';</text>
		</g>
	</g>

	<g transform="translate(120 545)" font-family="'Inter', sans-serif" text-anchor="middle">
		<text x="480" y="0" font-size="14" font-weight="500" fill="#a78bfa">GET · POST · QUERY — the missing method, 30 years in the making.</text>
	</g>
</svg>
